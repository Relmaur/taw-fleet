name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    # macOS: the tool targets Macs only, and the runner has no Local by Flywheel,
    # which proves the tests never read the real ~/Library.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Build both architectures
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/taw-fleet
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/taw-fleet
