# Release build: `git tag vX.Y.Z && git push origin vX.Y.Z` runs
# .github/workflows/release.yml, which runs this. Local dry run:
#   goreleaser release --snapshot --clean
version: 2

project_name: taw-fleet

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: taw-fleet
    main: ./cmd/taw-fleet
    binary: taw-fleet
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    # One signing identity for every build, and TAW Fleet.app around this binary,
    # so macOS keeps one privacy entry across upgrades (docs/signing.md).
    hooks:
      post:
        - cmd: scripts/macos-sign.sh app "{{ .Path }}" "{{ .Version }}" "dist/app/{{ .Arch }}"
  # taw: runs a theme's own vendor/bin/taw with its site's PHP (cmd/taw).
  - id: taw
    main: ./cmd/taw
    binary: taw
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: scripts/macos-sign.sh binary "{{ .Path }}" com.relmaur.taw

archives:
  # taw-fleet_0.7.0_darwin_arm64.tar.gz: the name self-update looks for.
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The top-level taw-fleet stays (self-update and `go install` users); the
    # cask installs TAW Fleet.app and links its copy.
    files:
      - README.md
      - LICENSE*
      # The bundle's three files, one by one: a ** glob skips Contents/Info.plist.
      - src: "dist/app/{{ .Arch }}/TAW Fleet.app/Contents/Info.plist"
        dst: "TAW Fleet.app/Contents"
        strip_parent: true
      - src: "dist/app/{{ .Arch }}/TAW Fleet.app/Contents/MacOS/taw-fleet"
        dst: "TAW Fleet.app/Contents/MacOS"
        strip_parent: true
      - src: "dist/app/{{ .Arch }}/TAW Fleet.app/Contents/_CodeSignature/CodeResources"
        dst: "TAW Fleet.app/Contents/_CodeSignature"
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^Merge branch"]

release:
  github:
    owner: Relmaur
    name: taw-fleet
  # Steps keep their hand-written notes: an existing release is left alone.
  mode: keep-existing

homebrew_casks:
  - name: taw-fleet
    repository:
      owner: Relmaur
      name: homebrew-tap
      # GoReleaser accepts only this exact form here (no template logic).
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Without the token secret the release still ships; only the cask is skipped.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    directory: Casks
    homepage: https://github.com/Relmaur/taw-fleet
    description: The TAW sites on this Mac (Local by Flywheel) in one terminal dashboard, and the taw command
    # taw-fleet is linked from the app (custom_block): /Applications/TAW Fleet.app
    # is the one identity macOS keeps permissions for (docs/signing.md).
    binaries: [taw]
    custom_block: |
      app "TAW Fleet.app"
      binary "#{appdir}/TAW Fleet.app/Contents/MacOS/taw-fleet"
    # taw-fleet watch's notifications open the dashboard when clicked through it.
    dependencies:
      - formula: terminal-notifier
    commit_author:
      name: taw-fleet release
      email: noreply@github.com
    commit_msg_template: "taw-fleet {{ .Tag }}"
    # Not notarized: drop the quarantine flag Homebrew sets on the download.
    hooks:
      post:
        install: |
          if OS.mac? && system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/taw-fleet"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/taw"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{appdir}/TAW Fleet.app"]
          end
